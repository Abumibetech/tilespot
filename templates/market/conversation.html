{% extends 'base.html' %}{% block content %}<section class="chatpage"><div class="kicker">MESSAGES</div><h1>{{ conversation.tile.name }}</h1><div class="chatbox">{% for m in conversation.messages.all %}<div class="bubble {% if m.sender == user %}mine{% endif %}"><span>{{ m.sender.username }}</span><p>{{ m.body }}</p><small>{{ m.created_at|date:'M d, H:i' }}</small></div>{% empty %}<p class="muted">Start the conversation.</p>{% endfor %}</div><form method="post" class="chatform">{% csrf_token %}<input name="body" placeholder="Write a message to the seller..." required><button class="btn btn-dark">Send</button></form></section>{% endblock %}
